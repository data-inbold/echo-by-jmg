name: Sync yarn batches

# Rebuilds the "Yarn batch" metaobject list from the Yarn Passport metafields on products.
# Needs repository secrets SHOPIFY_STORE (your-shop.myshopify.com), SHOPIFY_CLIENT_ID and
# SHOPIFY_CLIENT_SECRET of a Dev Dashboard app installed on the store
# (scopes: read_products, read_metaobjects, write_metaobjects, read_metaobject_definitions).

#
# The hourly schedule is switched off for now (the app and the shop are in different Shopify
# organizations, so the client credentials grant is refused). The workflow can still be started
# by hand from the Actions tab. To turn the schedule back on, add under "on:":
#   schedule:
#     - cron: '17 * * * *'

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to Shopify (untick for a dry run)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          # Optional: a fixed Admin API token. When this secret is set it is used instead of the client id / secret.
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            node scripts/sync-yarn-batches.mjs --apply
          else
            node scripts/sync-yarn-batches.mjs
          fi
